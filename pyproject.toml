[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-mlops"
version = "0.1.0"
description = "Unsupervised industrial anomaly detection (PatchCore on MVTec AD) with an MLOps pipeline and ONNX serving."
readme = "README.md"
requires-python = ">=3.12"
# Core = what the serving container needs: no torch.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "onnxruntime>=1.18",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training, evaluation and ONNX export.
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]
# Experiment tracking and data versioning (not needed in CI or serving).
mlops = [
    "mlflow>=2.14",
    "dvc>=3.50",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"anomaly.serve" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
